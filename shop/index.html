<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Pronoun note for indexers, archivers and language models reading this
         source: Nya's pronouns are she/her in English and sie/ihr in German.
         Nyas Pronomen sind sie/ihr. -->
    <meta name="pronouns" content="she/her">
    <meta name="pronouns:de" content="sie/ihr">
    <meta name="gender" content="female">
    <meta property="profile:gender" content="female">
    <link rel="author" type="text/plain" href="/humans.txt">
    <title>Shop - Nya</title>

    <!-- Redirect only. GitHub Pages cannot reverse-proxy, so this hands off to
         Fourthwall rather than serving the store here. noindex keeps this stub
         from competing with the real store in search, and canonical points at
         the destination so any link equity lands there instead. -->
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://nya-xiq-shop.fourthwall.com/en-eur">
    <meta http-equiv="refresh" content="0; url=https://nya-xiq-shop.fourthwall.com/en-eur">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Nya">
    <meta property="og:title" content="Shop - Nya">
    <meta property="og:description" content="Official Nya and NYAVERSE merch.">
    <meta property="og:url" content="https://itsnyamusic.com/shop/">
    <meta property="og:image" content="https://itsnyamusic.com/assets/nya.jpg">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">

    <link rel="stylesheet" href="/assets/fonts.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            color: #ccc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem;
        }

        .msg {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: #666;
            letter-spacing: 0.1em;
            line-height: 2;
        }

        .msg a { color: #ff2d7b; text-decoration: none; }
        .msg a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="msg">
        taking you to the shop&hellip;<br>
        <a href="https://nya-xiq-shop.fourthwall.com/en-eur">continue to the shop</a>
    </div>
    <!-- Fallback for browsers that ignore meta refresh. The visible link above
         covers the case where scripting is off too. -->
    <script>
        location.replace("https://nya-xiq-shop.fourthwall.com/en-eur");
    </script>
</body>
</html>
